spring.application.name=tecno-oro

# En la Mac el puerto es 8080. En Railway la variable PORT lo reemplaza.
server.address=0.0.0.0
server.port=${PORT:8080}

# H2 en archivo: la prueba corre sin instalar PostgreSQL.
# Los datos quedan en backend/data/tecnooro.*.db
spring.datasource.url=jdbc:h2:file:./data/tecnooro;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- PostgreSQL (usar esto en Windows si ya existe la base tecno_oro) ---
# Comentar las líneas H2 de arriba y descomentar las siguientes:
# spring.datasource.url=jdbc:postgresql://localhost:5432/tecno_oro
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=update
# spring.h2.console.enabled=false

app.jwt.secreto=${APP_JWT_SECRETO:tecno-oro-universidad-cambiar-esta-clave-32}
# Orígenes del navegador. En Railway se puede fijar la URL exacta de Vercel.
app.cors.origenes=${APP_CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200,https://*.vercel.app}
app.jwt.expira-horas=8
# false: el código sale solo por Gmail. No se devuelve en el JSON.
# El remitente y la contraseña de aplicación viven en config/correo.local.properties (no se sube a Git).
app.demo=false
app.minutos-codigo=15

spring.config.import=optional:file:./config/correo.local.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_REMITENTE:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.admin.correo=admin@tecnooro.com
app.admin.password=admin123
app.admin.nombre=Administrador
